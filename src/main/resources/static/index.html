<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpportunityOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h2>🚀 OpportunityOS</h2>
</nav>

<section class="hero">
    <h1>Shape Your Tech Career</h1>
    <p>
        Generate career roadmaps, analyze skill gaps,
        and improve your resume with OpportunityOS.
    </p>
</section>

<div class="cards-container">

    <div class="card">

        <h2>Career Roadmap Generator</h2>

        <select id="role">
            <option>AI Engineer</option>
            <option>Frontend Developer</option>
            <option>Backend Developer</option>
            <option>Cybersecurity Analyst</option>
            <option>Data Scientist</option>
        </select>

        <button onclick="generateRoadmap()">
            Generate Roadmap
        </button>

        <div id="result"></div>

    </div>

    <div class="card">

        <h2>Skill Gap Analyzer</h2>

        <input
                id="skills"
                placeholder="Enter skills separated by commas">

        <select id="skillRole">
            <option>AI Engineer</option>
            <option>Frontend Developer</option>
            <option>Backend Developer</option>
            <option>Cybersecurity Analyst</option>
            <option>Data Scientist</option>
        </select>

        <button onclick="analyzeSkills()">
            Analyze Skills
        </button>

        <div id="skillResult"></div>

    </div>

    <div class="card">

        <h2>Resume Analyzer</h2>

        <textarea
                id="resume"
                rows="8"
                placeholder="Paste your resume here">
        </textarea>

        <button onclick="analyzeResume()">
            Analyze Resume
        </button>

        <div id="resumeResult"></div>

    </div>

</div>

<footer>
    <p>Built by Divyaa Makhija • VESIT ECS</p>
</footer>

<script src="script.js"></script>

</body>
</html>
